name: Review Requirements Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  actions: write
  contents: read
  pull-requests: write

concurrency:
  group: review-requirements-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  route:
    if: github.event.pull_request.head.repo.id == github.repository_id
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted gate scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Route review
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/request-reviewers.sh --gate "$PR_NUMBER"
